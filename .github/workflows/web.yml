name: Web App Integration Tests

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  push:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run dependency vulnerability scan
        run: |
          cd apps/web
          # Fail the job if any High or Critical vulnerabilities are present
          npm audit --audit-level=high

      - name: Run CI integration script (build, serve, wait, install browsers, run tests)
        env:
          BASE_URL: http://localhost:3000
        run: |
          cd apps/web
          npm run ci:integration-tests --silent

      - name: Upload Playwright integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-report
          path: apps/web/playwright-report
